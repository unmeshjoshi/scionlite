plugins {
    id 'java'
}

group = 'com.versioncontrol'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://clojars.org/repo' }
}

def tickloomVersion = '0.1.0-beta.4'

dependencies {
    implementation "io.github.unmeshjoshi:tickloom:${tickloomVersion}"
    testImplementation "io.github.unmeshjoshi:tickloom-testkit:${tickloomVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
